<body data-page="soft-seating">
    <div data-include="includes/header.html"></div>
    <main class="seating-page">
        <section class="seating-hero page-banner">
            <div class="seating-hero-image"><img src="assets/images/banner-seating.png"
                    alt="Cofur soft seating in a collaborative workspace"></div>
            <div class="seating-hero-copy">
                <h1>Soft Seating</h1>
            </div>
        </section>
        <section class="seating-collections" aria-labelledby="seating-collections-title">
            <!-- <h2 id="seating-collections-title">Seating<br>collection</h2> -->
            <div class="seating-grid">
                <a class="seating-card seating-card--cove" href="collection.html"
                    aria-label="Explore Cove collection">
                    <div class="seating-product"><img src="assets/images/green-top2.webp"
                            alt="Cove seats arranged around a shared table"></div>
                    <div class="seating-card-copy">
                        <h3 data-static-title>Cove collection</h3>
                        <p class="eyebrow">Privacy and focus within open spaces</p>
                    </div><img class="seating-hover-arrow" src="assets/images/frame1.svg" alt="">
                </a>
                <a class="seating-card seating-card--pebble" href="contact.html?collection=pebble"
                    aria-label="Enquire about Pebble collection">
                    <div class="seating-product"><img src="assets/images/dark-blue-front1.webp"
                            alt="Pebble sofa with soft organic cushions"></div>
                    <div class="seating-card-copy">
                        <h3 data-static-title>Pebble collection</h3>
                        <p class="eyebrow">Flexible, organic seating for fluid environments</p>
                    </div><img class="seating-hover-arrow" src="assets/images/frame1.svg" alt="">
                </a>
                <div class="seating-lifestyle">
                    <picture data-shot="seating-lifestyle">
                        <source media="(max-width:767px)"
                            srcset="assets/images/seating-lifestyle-v2-m480.webp 480w, assets/images/seating-lifestyle-v2-m736.webp 736w"
                            sizes="100vw">
                        <img src="assets/images/seating-lifestyle-v2-d736.webp"
                            srcset="assets/images/seating-lifestyle-v2-d640.webp 640w, assets/images/seating-lifestyle-v2-d736.webp 736w"
                            sizes="(max-width:900px) 100vw, 34vw" width="736" height="981"
                            alt="Pale blue upholstery fabric swatch lifted from a soft seating sample board"
                            loading="lazy" decoding="async">
                    </picture>
                </div>
                <a class="seating-card seating-card--orbit" href="contact.html?collection=orbit"
                    aria-label="Enquire about Orbit collection">
                    <div class="seating-product"><img src="assets/images/red-up1.webp"
                            alt="Orbit circular seating with a central planter"></div>
                    <div class="seating-card-copy">
                        <h3 data-static-title>Orbit collection</h3>
                        <p class="eyebrow">Large-scale social hubs with a biophilic touch</p>
                    </div><img class="seating-hover-arrow" src="assets/images/frame1.svg" alt="">
                </a>
                <a class="seating-card seating-card--grove" href="contact.html?collection=grove"
                    aria-label="Enquire about Grove collection">
                    <div class="seating-product"><img src="assets/images/beige-front3.webp"
                            alt="Grove modular sofa with an integrated planter"></div>
                    <div class="seating-card-copy">
                        <h3 data-static-title>Grove collection</h3>
                        <p class="eyebrow">Nature-inspired comfort for modern workspaces</p>
                    </div><img class="seating-hover-arrow" src="assets/images/frame1.svg" alt="">
                </a>
            </div>
        </section>
